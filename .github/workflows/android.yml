#
# CI for the web app and the Android apps (phone and Wear OS watch).
#   test          typecheck, unit tests and browser end-to-end tests (every PR, push to main, tag)
#   build-android builds both APKs with scripts/build-android.sh and checks they share one signing certificate (debug-signed MVP, no keystore secrets)
#   release       on a v* tag only: attaches the two release APKs, renamed *-mvp-debugsigned.apk, and a combined SHA256SUMS.txt to a GitHub Release
name: android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege by default; only the release job is allowed to write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # package.json "engines" asks for Node 24 or newer.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Tag must match the package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Kotlin engine unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # MVP: both APKs are signed with the auto-generated debug key. There is no release keystore.
      - name: Build phone and watch APKs
        # The Android SDK is preinstalled on ubuntu-latest; ANDROID_HOME is already set by the image.
        run: scripts/build-android.sh

      # WHY: the Wear OS Data Layer only delivers messages between apps with the same package name AND the
      # same signing certificate. If the two APKs ever differ, the watch silently stops talking to the phone.
      - name: Phone and watch APKs must share one signing certificate
        run: |
          version="$(node -p "require('./package.json').version")"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          digest() {
            "$apksigner" verify --print-certs "$1" | tee /dev/stderr | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          phone="$(digest "dist-android/SleepingAid-${version}.apk")"
          watch="$(digest "dist-android/SleepingAid-Watch-${version}.apk")"
          echo "phone SHA-256: $phone"
          echo "watch SHA-256: $watch"
          if [ -z "$phone" ] || [ "$phone" != "$watch" ]; then
            echo "::error::Phone and watch release APKs are not signed by the same certificate."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist-android/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [test, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n 1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: dist-android
      - name: Name the assets and write combined checksums
        working-directory: dist-android
        run: |
          cp "SleepingAid-${VERSION}.apk" "SleepingAid-${VERSION}-phone-mvp-debugsigned.apk"
          cp "SleepingAid-Watch-${VERSION}.apk" "SleepingAid-${VERSION}-watch-mvp-debugsigned.apk"
          sha256sum "SleepingAid-${VERSION}-phone-mvp-debugsigned.apk" "SleepingAid-${VERSION}-watch-mvp-debugsigned.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes header
        run: |
          cat > release-header.md <<'EOF'
          **MVP build, signed with a debug key.**

          - Future versions may not install over this one. Uninstall the previous version first (this deletes the app's data).
          - Install the phone and watch APKs from the same release; they must share one signing key.
          - Verify the files against `SHA256SUMS.txt`.
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: release-header.md
          files: |
            dist-android/SleepingAid-${{ env.VERSION }}-phone-mvp-debugsigned.apk
            dist-android/SleepingAid-${{ env.VERSION }}-watch-mvp-debugsigned.apk
            dist-android/SHA256SUMS.txt
