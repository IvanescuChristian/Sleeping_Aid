#
# CI for the web app and the Android apps (phone and Wear OS watch).
#   test          typecheck, unit tests and browser end-to-end tests (every PR, push to main, tag)
#   build-android builds both APKs with scripts/build-android.sh and checks they share one signing certificate (CI has no keystore, so these are debug-signed check builds)
#
# CI publishes nothing. Releases are signed locally with the maintainer's release key and uploaded by hand
# (scripts/release-android.sh, docs/SIGNING.md). Pushing a v* tag only runs these checks, including the
# tag-equals-package.json-version check.
name: android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Read-only: no job publishes or writes anything.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # package.json "engines" asks for Node 24 or newer.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Tag must match the package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      # CI has no release keystore: both APKs are signed with the auto-generated debug key (check build only).
      - name: Build phone and watch APKs
        # The Android SDK is preinstalled on ubuntu-latest; ANDROID_HOME is already set by the image.
        run: scripts/build-android.sh

      # Runs after the build because cap sync generates Gradle files the project needs.
      - name: Kotlin engine unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # WHY: the Wear OS Data Layer only delivers messages between apps with the same package name AND the
      # same signing certificate. If the two APKs ever differ, the watch silently stops talking to the phone.
      - name: Phone and watch APKs must share one signing certificate
        run: |
          version="$(node -p "require('./package.json').version")"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          digest() {
            "$apksigner" verify --print-certs "$1" | tee /dev/stderr | grep -m1 'certificate SHA-256 digest:' | sed 's/.*certificate SHA-256 digest: *//'
          }
          phone="$(digest "dist-android/SleepingAid-${version}.apk")"
          watch="$(digest "dist-android/SleepingAid-Watch-${version}.apk")"
          echo "phone SHA-256: $phone"
          echo "watch SHA-256: $watch"
          if [ -z "$phone" ] || [ "$phone" != "$watch" ]; then
            echo "::error::Phone and watch release APKs are not signed by the same certificate."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-check-apks-debugsigned
          path: dist-android/
          if-no-files-found: error
